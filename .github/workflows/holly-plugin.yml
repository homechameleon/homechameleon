# Validates the Holly plugin and the root marketplace manifest.
# Path filters keep it off other HomeChameleon changes.
name: holly-plugin

on:
  push:
    paths:
      - "holly-for-home-assistant/**"
      - ".cursor-plugin/marketplace.json"
      - ".github/workflows/holly-plugin.yml"
  pull_request:
    paths:
      - "holly-for-home-assistant/**"
      - ".cursor-plugin/marketplace.json"
      - ".github/workflows/holly-plugin.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin JSON, variables, and marketplace entries
        run: python3 holly-for-home-assistant/scripts/validate_plugin.py
