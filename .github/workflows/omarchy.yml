# HomeChameleon for Omarchy: CI for the omarchy/ folder of the monorepo.
# Kept outside .github on purpose; copy to .github/workflows/omarchy.yml in
# the homechameleon repository.
name: omarchy

on:
  push:
    branches: [main]
    tags: ["omarchy-v*"]
    paths: ["omarchy/**", ".github/workflows/omarchy.yml"]
  pull_request:
    paths: ["omarchy/**", ".github/workflows/omarchy.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck imagemagick ffmpeg jq python3 curl gawk

      - name: Shellcheck
        run: shellcheck omarchy/bin/* omarchy/tests/*.sh

      - name: Fetch Omarchy (template renderer and hook runner used by the tests)
        run: git clone --depth 1 https://github.com/basecamp/omarchy "$RUNNER_TEMP/omarchy"

      - name: Run tests
        env:
          OMARCHY_CLONE: ${{ runner.temp }}/omarchy
        run: omarchy/tests/run-tests.sh

      - name: Check PKGBUILD syntax
        run: bash -n omarchy/PKGBUILD
