[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"
authors = ["HomeChameleon contributors"]
repository = "https://github.com/homechameleon/homechameleon"
description = "Theme generator for Home Assistant"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
