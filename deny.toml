# License allow-list for HomeChameleon. Anything else fails CI.
# SPDX identifiers only: MIT, Apache-2.0, BSD, ISC, Zlib, Unicode.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
]

[advisories]
yanked = "deny"
unmaintained = "none"

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "serde_yaml", reason = "deprecated; HomeChameleon emits theme YAML itself" },
    { crate = "serde_yml", reason = "RUSTSEC-2025-0068" },
    { crate = "imagequant", reason = "GPL-3.0-or-later would cover the whole build" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
